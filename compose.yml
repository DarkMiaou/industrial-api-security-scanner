services:
  # Local-only simulated OT target. Intentionally not published on the host.
  ot-gateway-demo:
    image: iass-ot-gateway-demo:local
    build:
      context: .
      dockerfile: ot-gateway-demo/Dockerfile
    container_name: iass_ot_gateway_prod
    environment:
      OT_PROFILE: ${OT_PROFILE:-hardened}
      OT_JWT_SECRET: ${OT_JWT_SECRET}
      OT_DEMO_RESET_KEY: ${OT_DEMO_RESET_KEY}
    expose:
      - "8081"
    networks:
      - apisec_network
    restart: always

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: apisec_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apipass}
      POSTGRES_DB: ${POSTGRES_DB:-apisecurity}
    # Uncomment to expose DB port (not recommended for production)
    # ports:
    #   - "${HOST_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apiuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apisec_network
    restart: always

  # FastAPI Backend
  backend:
    image: iass-backend-prod:local
    build:
      context: .
      dockerfile: conf/docker/prod/fastapi.docker
    container_name: apisec_backend_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apiuser}:${POSTGRES_PASSWORD:-apipass}@db:5432/${POSTGRES_DB:-apisecurity}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
      OT_GATEWAY_URL: http://ot-gateway-demo:8081
      OT_DEMO_RESET_KEY: ${OT_DEMO_RESET_KEY}
      SCANNER_REQUEST_BUDGET: 60
      SCANNER_CONNECTION_TIMEOUT: 3
      SCANNER_READ_TIMEOUT: 5
      SCANNER_MAX_RESPONSE_BYTES: 1048576
      SCANNER_EVIDENCE_EXCERPT_CHARS: 500
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      ot-gateway-demo:
        condition: service_healthy
    networks:
      - apisec_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx serving static files
  frontend:
    image: iass-frontend-prod:local
    build:
      context: .
      dockerfile: conf/docker/prod/vite.docker
    container_name: apisec_frontend_prod
    ports:
      - "${HOST_NGINX_PORT:-80}:80"
      # Uncomment for HTTPS - or dns proxy with Cloudfare:
      # - "${HOST_NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - apisec_network
    restart: always
    # Optional: Mount SSL certificates for HTTPS -
    # or dns proxy with Cloudfare (easier)
    # volumes:
    #   - ./ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data_prod:
    name: apisec_postgres_data_prod

networks:
  apisec_network:
    name: apisec_network_prod
    driver: bridge
