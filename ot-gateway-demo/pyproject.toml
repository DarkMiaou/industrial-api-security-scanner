[project]
name = "iass-ot-gateway-demo"
version = "0.1.0"
description = "Deterministic OT water-pump gateway used only by the IASS laboratory"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.0",
    "python-jose[cryptography]==3.5.0",
    "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
    "ruff==0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 95

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
